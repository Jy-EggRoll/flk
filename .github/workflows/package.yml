name: Package Development Release

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+.dev.[0-9]+"
    workflow_dispatch:
        inputs:
            version:
                description: 'Custom version string (e.g., v0.1.3.dev.123)'
                required: false
                default: ''

permissions:
    contents: write

jobs:
    package:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.26.0"

            - name: Get version info
              id: get_version
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.inputs.version }}" ]; then
                    VERSION="${{ github.inputs.version }}"
                    echo "Custom version: $VERSION"
                  elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    VERSION="dev-$(date +%Y%m%d-%H%M%S)"
                    echo "Manual run - using timestamp version: $VERSION"
                  else
                    VERSION=${GITHUB_REF#refs/tags/}
                    echo "Tag triggered - using tag version: $VERSION"
                  fi
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Get build time
              id: get_build_time
              run: |
                  BUILDTIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  echo "buildtime=$BUILDTIME" >> $GITHUB_OUTPUT

            - name: Build binaries for common platforms
              run: |
                  mkdir -p build

                  VERSION="${{ steps.get_version.outputs.version }}"
                  BUILDTIME="${{ steps.get_build_time.outputs.buildtime }}"
                  LDFLAGS="-s -w -X 'github.com/jy-eggroll/flk/cmd.Version=$VERSION' -X 'github.com/jy-eggroll/flk/cmd.BuildTime=$BUILDTIME'"

                  echo "========================================"
                  echo "开始交叉编译 Go 二进制文件（仅常用平台）"
                  echo "========================================"
                  echo ""

                  echo "[1/11] 编译 Windows x86 (386)..."
                  GOOS=windows GOARCH=386 go build -ldflags="$LDFLAGS" -o build/flk-windows-386.exe
                  echo "完成"

                  echo "[2/11] 编译 Windows x64 (amd64)..."
                  GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o build/flk-windows-amd64.exe
                  echo "完成"

                  echo "[3/11] 编译 Windows ARM64..."
                  GOOS=windows GOARCH=arm64 go build -ldflags="$LDFLAGS" -o build/flk-windows-arm64.exe
                  echo "完成"

                  echo ""
                  echo "[4/11] 编译 Linux x86 (386)..."
                  GOOS=linux GOARCH=386 go build -ldflags="$LDFLAGS" -o build/flk-linux-386
                  echo "完成"

                  echo "[5/11] 编译 Linux x64 (amd64)..."
                  GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o build/flk-linux-amd64
                  echo "完成"

                  echo "[6/11] 编译 Linux ARM (armv7)..."
                  GOOS=linux GOARCH=arm go build -ldflags="$LDFLAGS" -o build/flk-linux-arm
                  echo "完成"

                  echo "[7/11] 编译 Linux ARM64..."
                  GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o build/flk-linux-arm64
                  echo "完成"

                  echo ""
                  echo "[8/11] 编译 macOS x64 (amd64)..."
                  GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o build/flk-darwin-amd64
                  echo "完成"

                  echo "[9/11] 编译 macOS ARM64 (Apple Silicon)..."
                  GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o build/flk-darwin-arm64
                  echo "完成"

                  echo ""
                  echo "[10/11] 编译 FreeBSD x64 (amd64)..."
                  GOOS=freebsd GOARCH=amd64 go build -ldflags="$LDFLAGS" -o build/flk-freebsd-amd64
                  echo "完成"

                  echo "[11/11] 编译 FreeBSD ARM64..."
                  GOOS=freebsd GOARCH=arm64 go build -ldflags="$LDFLAGS" -o build/flk-freebsd-arm64
                  echo "完成"

                  echo ""
                  echo "========================================"
                  echo "编译完成！统计信息："
                  echo "========================================"
                  echo "总文件数: $(ls -1 build/ | wc -l)"
                  echo "总大小: $(du -sh build/ | cut -f1)"

            - name: Find previous version tag
              id: previous_tag
              run: |
                  CURRENT_TAG="${{ steps.get_version.outputs.version }}"

                  PREVIOUS_TAG=$(git tag -l --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | head -n1)

                  if [ -n "$PREVIOUS_TAG" ]; then
                    echo "Found previous tag: $PREVIOUS_TAG"
                    echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
                  else
                    echo "No previous tag found"
                    echo "previous_tag=" >> $GITHUB_OUTPUT
                  fi

            - name: Generate release notes
              id: release_notes
              uses: Jy-EggRoll/changelog-to-release@main
              with:
                  version: ${{ steps.get_version.outputs.version }}
                  previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
                  repo: ${{ github.repository }}
                  binary_name: flk

            - name: Create development release (tag or manual with custom version)
              if: github.event_name != 'workflow_dispatch' || github.inputs.version != ''
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.get_version.outputs.version }}
                  name: "flk v${{ steps.get_version.outputs.version }} (开发版)"
                  body: |
                      # 🚧 开发版本 - 仅供测试

                      这是一个开发版本，仅供测试使用。请谨慎使用，可能包含不稳定或实验性功能。

                      ${{ steps.release_notes.outputs.content }}

                      ## 版本信息

                      - 版本号: ${{ steps.get_version.outputs.version }}
                      - 构建时间: ${{ github.run_id }}
                      - 提交: ${{ github.sha }}

                      ## 注意事项

                      ⚠️ 仅通过 GitHub Release 提供下载
                      ⚠️ 可能包含未经充分测试的功能
                  files: |
                      build/*
                  draft: false
                  prerelease: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: binaries-${{ steps.get_version.outputs.version }}
                  path: build/*
                  retention-days: 30
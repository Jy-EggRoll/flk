name: Continuous Integration

on:
    # 拉取请求与推送的分工不同：PR 只要快速验证反馈，推送才需要留下可下载的构建产物
    pull_request: {}
    # 只匹配分支推送而不匹配标签推送：标签由 package/publish 工作流负责，
    # 否则打标签时会再触发一次完全相同的全平台构建，白白消耗 CI 时间
    push:
        branches:
            - "**"

# 权限刻意保留在此处而不再写进可复用工作流：可复用工作流拿到的令牌权限以调用方为上限，
# 这里维持只读，与其下的两个任务所需完全一致（校验与上传产物都不需要写权限）
permissions:
    contents: read

jobs:
    # PR 只做验证不构建，反馈更快；跨平台编译问题由推送触发的 build 任务负责发现
    # 具体工作（checkout / setup / verify）全部委托给可复用工作流，本文件只保留触发条件与权限
    verify:
        if: github.event_name == 'pull_request'
        uses: ./.github/workflows/build.yml
        with:
            mode: verify-only

    # 推送时验证并构建全部平台，产物保留下来，使任意分支都能直接下载二进制做实测
    build:
        if: github.event_name == 'push'
        uses: ./.github/workflows/build.yml
        with:
            mode: artifact
            # 推送构建使用时间戳版本号，与发布构建的语义化版本号清楚区分，
            # 也避免本地开发构建被误认为某个正式版本
            version_source: timestamp
            # 分支构建沿用 flk- 前缀，与发布流程的 binaries- 保持既有差异
            artifact_prefix: flk-
            # 单次构建 11 个平台约 90MB，保留 3 天足够验证使用，
            # 时间过长会在频繁推送时占满免费存储配额并导致后续上传失败
            retention_days: 3

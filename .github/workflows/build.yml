# 可复用工作流：把 ci.yml / package.yml / publish.yml 中逐字重复的构建流程收敛到一处
# 原先三个工作流都各自抄了一遍 checkout / setup-go / setup-task / 取版本 / 取构建时间 /
# verify / build-all / changelog / 建 Release / 上传产物，差异仅在于触发条件、权限、
# 产物命名与保留天数、以及是否建 Release。此处把公共部分抽出，调用方只保留各自的
# 「触发条件」与「权限」，差异通过下面的 inputs 表达
# 该文件只声明 workflow_call，不会被 push / PR 等事件直接触发
name: Build

on:
    workflow_call:
        inputs:
            # 投递方式，决定「校验之后做什么」，四种取值与三个调用方的路径一一对应
            # verify-only：只跑校验，不构建、不上传        —— 对应 ci 的 PR 路径
            # artifact   ：校验 + 全平台构建 + 上传产物      —— 对应 ci 的 push 路径、package 的手动运行
            # prerelease ：校验 + 构建 + dev 更新日志 + 开发预发布 —— 对应 package 的 tag 路径
            # release    ：校验 + 构建 + 更新日志 + 正式发布   —— 对应 publish
            mode:
                description: '投递方式：verify-only / artifact / prerelease / release'
                required: true
                type: string

            # 版本号来源，决定二进制内嵌版本号与产物名所用的版本串
            # tag           ：取触发本次运行的标签名            —— package 的 tag 路径、publish
            # timestamp     ：形如 2026-10-01-12-00-00          —— ci 的 push 路径
            # dev-timestamp ：形如 dev-20261001-120000          —— package 的手动运行
            # 三者格式刻意保留差异：这是改造前各工作流既有的取版本逻辑，统一会改变产物名与内嵌版本号
            version_source:
                description: '版本号来源：tag / timestamp / dev-timestamp'
                required: false
                type: string
                default: 'tag'

            # 产物名称前缀，最终产物名 = 前缀 + 版本号
            # ci 用 flk-，package/publish 用 binaries-，这是改造前的既有差异，必须原样保留
            artifact_prefix:
                description: '上传产物的名称前缀（产物名 = 前缀 + 版本号）'
                required: false
                type: string
                default: 'binaries-'

            # 产物保留天数：ci 3 天、package 30 天、publish 90 天，由调用方各自传入
            retention_days:
                description: '产物保留天数'
                required: false
                type: number
                default: 3

jobs:
    build:
        # 刻意不在此声明 permissions：可复用工作流拿到的令牌权限始终以调用方为上限，
        # 调用方已各自保留原样（ci=contents:read，package/publish=contents:write），
        # 因此这里实际权限与改造前完全一致，无需也不应再重复声明
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  # 取全量历史与所有标签：changelog 依赖 git tag 列表，浅克隆看不到历史标签
                  # 副作用：ci 分支构建的克隆比改造前更深（原为默认 1），但构建产物完全一致
                  fetch-depth: 0

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  # 始终以 go.mod 为 Go 版本的唯一来源，避免工作流与项目配置漂移
                  go-version-file: go.mod

            - name: Setup Task
              uses: go-task/setup-task@v2
              with:
                  # setup-task 的版本号在此收敛为全仓唯一一处，杜绝四个文件各写一遍而漂移
                  version: 3.x

            # 取版本号：三种来源逐字复刻改造前各工作流的逻辑，仅做分支选择
            # 用 env 传入而非直接内插到脚本里，避免输入被当作 shell 代码执行
            - name: Get version
              if: inputs.mode != 'verify-only'
              id: get_version
              env:
                  VERSION_SOURCE: ${{ inputs.version_source }}
              run: |
                  case "$VERSION_SOURCE" in
                    tag)
                      VERSION=${GITHUB_REF#refs/tags/}
                      ;;
                    timestamp)
                      VERSION=$(date '+%Y-%m-%d-%H-%M-%S')
                      ;;
                    dev-timestamp)
                      VERSION="dev-$(date +%Y%m%d-%H%M%S)"
                      ;;
                    *)
                      echo "未知的 version_source：$VERSION_SOURCE" >&2
                      exit 1
                      ;;
                  esac
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            # 构建时间只被 build-all 消费，verify-only 模式下没有消费者，
            # 因而与「取版本号」同样跳过：改造前 PR 路径也不存在这一步，条件保持等价
            - name: Get build time
              if: inputs.mode != 'verify-only'
              id: get_build_time
              run: |
                  BUILDTIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  echo "buildtime=$BUILDTIME" >> "$GITHUB_OUTPUT"

            # 先验证再构建：验证失败时不会产出任何可执行文件，避免把有问题的二进制交到手上
            - name: Verify source
              run: task verify

            - name: Build binaries for all platforms
              if: inputs.mode != 'verify-only'
              run: task build-all
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
                  BUILDTIME: ${{ steps.get_build_time.outputs.buildtime }}

            # dev 版更新日志：TYPE=dev 会加入开发版警告与版本信息，并把 tag 匹配放宽到任意标签
            - name: Generate release notes (dev)
              if: inputs.mode == 'prerelease'
              run: task changelog VERSION=${{ steps.get_version.outputs.version }} TYPE=dev > release_notes.md

            # 正式版更新日志：TYPE 走 Taskfile 默认值 release，只匹配 semver 标签并附带 CHANGELOG 摘要
            - name: Generate release notes
              if: inputs.mode == 'release'
              run: task changelog VERSION=${{ steps.get_version.outputs.version }} > release_notes.md

            - name: Create development release
              if: inputs.mode == 'prerelease'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.get_version.outputs.version }}
                  name: "flk v${{ steps.get_version.outputs.version }} (开发版)"
                  body_path: release_notes.md
                  files: |
                      build/*
                  draft: false
                  prerelease: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Create GitHub Release
              if: inputs.mode == 'release'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.get_version.outputs.version }}
                  name: "flk v${{ steps.get_version.outputs.version }}"
                  body_path: release_notes.md
                  files: |
                      build/*
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload build artifacts
              if: inputs.mode != 'verify-only'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ inputs.artifact_prefix }}${{ steps.get_version.outputs.version }}
                  path: build/*
                  retention-days: ${{ inputs.retention_days }}

version: '3'

vars:
  APP: flk
  VERSION:
    sh: printf '%s' "${VERSION:-$(date '+%Y-%m-%d-%H-%M-%S')}"
  BUILDTIME:
    sh: printf '%s' "${BUILDTIME:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
  TYPE:
    sh: printf '%s' "${TYPE:-release}"
  LDFLAGS: '-s -w -X github.com/jy-eggroll/flk/cmd.Version={{.VERSION}} -X github.com/jy-eggroll/flk/cmd.BuildTime={{.BUILDTIME}}'

tasks:
  default:
    desc: Build for all platforms
    deps:
      - build-all

  build-all:
    desc: Build all platform binaries in parallel
    deps:
      - build:windows:386
      - build:windows:amd64
      - build:windows:arm64
      - build:linux:386
      - build:linux:amd64
      - build:linux:arm
      - build:linux:arm64
      - build:darwin:amd64
      - build:darwin:arm64
      - build:freebsd:amd64
      - build:freebsd:arm64

  build:
    desc: Build for current platform
    cmds:
      - go build -ldflags="{{.LDFLAGS}}" -trimpath -o build/{{.APP}}{{exeExt}} .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - build/{{.APP}}{{exeExt}}

  build:windows:386:
    desc: Cross-compile windows/386
    cmds:
      - mkdir -p build
      - CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -ldflags="{{.LDFLAGS}}" -trimpath -o build/{{.APP}}-windows-386.exe .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - build/{{.APP}}-windows-386.exe

  build:windows:amd64:
    desc: Cross-compile windows/amd64
    cmds:
      - mkdir -p build
      - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="{{.LDFLAGS}}" -trimpath -o build/{{.APP}}-windows-amd64.exe .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - build/{{.APP}}-windows-amd64.exe

  build:windows:arm64:
    desc: Cross-compile windows/arm64
    cmds:
      - mkdir -p build
      - CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="{{.LDFLAGS}}" -trimpath -o build/{{.APP}}-windows-arm64.exe .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - build/{{.APP}}-windows-arm64.exe

  build:linux:386:
    desc: Cross-compile linux/386
    cmds:
      - mkdir -p build
      - CGO_ENABLED=0 GOOS=linux GOARCH=386 go build -ldflags="{{.LDFLAGS}}" -trimpath -o build/{{.APP}}-linux-386 .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - build/{{.APP}}-linux-386

  build:linux:amd64:
    desc: Cross-compile linux/amd64
    cmds:
      - mkdir -p build
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="{{.LDFLAGS}}" -trimpath -o build/{{.APP}}-linux-amd64 .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - build/{{.APP}}-linux-amd64

  build:linux:arm:
    desc: Cross-compile linux/arm (armv7)
    cmds:
      - mkdir -p build
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm go build -ldflags="{{.LDFLAGS}}" -trimpath -o build/{{.APP}}-linux-arm .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - build/{{.APP}}-linux-arm

  build:linux:arm64:
    desc: Cross-compile linux/arm64
    cmds:
      - mkdir -p build
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="{{.LDFLAGS}}" -trimpath -o build/{{.APP}}-linux-arm64 .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - build/{{.APP}}-linux-arm64

  build:darwin:amd64:
    desc: Cross-compile darwin/amd64
    cmds:
      - mkdir -p build
      - CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="{{.LDFLAGS}}" -trimpath -o build/{{.APP}}-darwin-amd64 .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - build/{{.APP}}-darwin-amd64

  build:darwin:arm64:
    desc: Cross-compile darwin/arm64 (Apple Silicon)
    cmds:
      - mkdir -p build
      - CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="{{.LDFLAGS}}" -trimpath -o build/{{.APP}}-darwin-arm64 .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - build/{{.APP}}-darwin-arm64

  build:freebsd:amd64:
    desc: Cross-compile freebsd/amd64
    cmds:
      - mkdir -p build
      - CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build -ldflags="{{.LDFLAGS}}" -trimpath -o build/{{.APP}}-freebsd-amd64 .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - build/{{.APP}}-freebsd-amd64

  build:freebsd:arm64:
    desc: Cross-compile freebsd/arm64
    cmds:
      - mkdir -p build
      - CGO_ENABLED=0 GOOS=freebsd GOARCH=arm64 go build -ldflags="{{.LDFLAGS}}" -trimpath -o build/{{.APP}}-freebsd-arm64 .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - build/{{.APP}}-freebsd-arm64

  test:
    desc: Run all Go tests
    cmds:
      - go test ./... -count=1

  changelog:
    desc: '生成发布更新日志并输出到 stdout（用法: task changelog VERSION=x.y.z [TYPE=release|dev]）'
    cmds:
      - |
        set -e
        TYPE="{{.TYPE}}"
        CURRENT_TAG="{{.VERSION}}"

        if [ -z "$CURRENT_TAG" ]; then
          echo "Error: VERSION is required. Usage: task changelog VERSION=x.y.z" >&2
          exit 1
        fi

        # 根据类型决定 tag 匹配模式：dev 版匹配任意标签，正式版只匹配 semver
        if [ "$TYPE" = "dev" ]; then
          TAG_PATTERN='.'
        else
          TAG_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$'
        fi
        PREVIOUS_TAG=$(git tag -l --sort=-version:refname | grep -E "$TAG_PATTERN" | grep -v "^$CURRENT_TAG$" | head -n1 || true)

        # Dev 版本警告头部
        if [ "$TYPE" = "dev" ]; then
          echo "## 开发版本 - 仅供测试"
          echo ""
          echo "这是一个开发版本，仅供测试使用。请谨慎使用，可能包含不稳定或实验性功能。"
          echo ""
        fi

        # 快速下载表格
        echo "## 快速下载"
        echo ""
        echo "| 架构 | Windows | Linux | macOS | FreeBSD |"
        echo "|------|---------|-------|-------|---------|"
        echo "| **x86 (32位)** | [x86](https://github.com/Jy-EggRoll/flk/releases/download/$CURRENT_TAG/flk-windows-386.exe) | [x86](https://github.com/Jy-EggRoll/flk/releases/download/$CURRENT_TAG/flk-linux-386) | 不支持 | 不支持 |"
        echo "| **x64 (64位)** | [x64](https://github.com/Jy-EggRoll/flk/releases/download/$CURRENT_TAG/flk-windows-amd64.exe) | [x64](https://github.com/Jy-EggRoll/flk/releases/download/$CURRENT_TAG/flk-linux-amd64) | [x64](https://github.com/Jy-EggRoll/flk/releases/download/$CURRENT_TAG/flk-darwin-amd64) | [x64](https://github.com/Jy-EggRoll/flk/releases/download/$CURRENT_TAG/flk-freebsd-amd64) |"
        echo "| **ARM64** | [ARM64](https://github.com/Jy-EggRoll/flk/releases/download/$CURRENT_TAG/flk-windows-arm64.exe) | [ARM64](https://github.com/Jy-EggRoll/flk/releases/download/$CURRENT_TAG/flk-linux-arm64) | [ARM64](https://github.com/Jy-EggRoll/flk/releases/download/$CURRENT_TAG/flk-darwin-arm64) | [ARM64](https://github.com/Jy-EggRoll/flk/releases/download/$CURRENT_TAG/flk-freebsd-arm64) |"
        echo "| **ARM (armv7)** | 不支持 | [ARM](https://github.com/Jy-EggRoll/flk/releases/download/$CURRENT_TAG/flk-linux-arm) | 不支持 | 不支持 |"
        echo ""
        echo "> **提示**：Windows 用户下载 .exe 文件，其他系统下载后需要添加执行权限 chmod +x flk-*"
        echo ""
        echo "---"
        echo ""

        # Dev 版本输出版本信息
        if [ "$TYPE" = "dev" ]; then
          echo "## 版本信息"
          echo ""
          echo "- 版本号: $CURRENT_TAG"
          echo "- 提交: $(git rev-parse HEAD)"
          echo ""
        fi

        # 从 CHANGELOG.md 提取当前版本的更新内容（仅正式版）
        if [ "$TYPE" != "dev" ] && [ -f "CHANGELOG.md" ]; then
          echo "## 主要更新内容"
          awk -v version="$CURRENT_TAG" '
            /^##/ {
              if (found) exit
              if ($0 ~ version) found=1
              next
            }
            found && /^##/ { exit }
            found { print }
          ' CHANGELOG.md
          echo ""
        fi

        echo "## 详细提交记录"
        echo ""

        # 用 GitHub compare 链接替代冗长的提交列表
        if [ -z "$PREVIOUS_TAG" ]; then
          echo "首次发布"
        else
          echo "[查看 $PREVIOUS_TAG 到 $CURRENT_TAG 的完整变更](https://github.com/Jy-EggRoll/flk/compare/$PREVIOUS_TAG...$CURRENT_TAG)"
          echo ""
        fi

        echo "---"
        echo ""

        # 底部信息
        if [ "$TYPE" = "dev" ]; then
          echo "## 注意事项"
          echo ""
          echo "仅通过 GitHub Release 提供下载"
          echo "可能包含未经充分测试的功能"
        else
          echo "**安装说明：**"
          echo ""
          echo "1. 从上方表格中选择并下载对应平台和架构的二进制文件"
          echo "2. Linux/macOS/BSD 用户需要赋予执行权限：\`chmod +x flk-*\`（建议直接将文件改名为 flk 方便调用和后续的升级）"
          echo "3. 运行程序（建议直接将文件改名为 flk 方便调用）\`flk help\`"
          echo ""
          echo "详细使用说明请参考 [README.md](https://github.com/Jy-EggRoll/flk/blob/main/README.md)"
        fi

  clean:
    desc: Remove all build artifacts
    cmds:
      - rm -rf build/

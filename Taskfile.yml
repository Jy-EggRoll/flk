version: '3'

vars:
  APP: flk
  VERSION:
    sh: printf '%s' "${VERSION:-$(date '+%Y-%m-%d-%H-%M-%S')}"
  BUILDTIME:
    sh: printf '%s' "${BUILDTIME:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
  TYPE:
    sh: printf '%s' "${TYPE:-release}"
  # NOTES_LANG 是发布说明语言的临时覆盖项，留空表示用清单里的 releaseNotesLang(zh-CN)
  # 用 shell 变量回填是为了让 `NOTES_LANG=en task changelog ...` 这种写法也能生效；
  # 可复用工作流是以 CLI 变量（task changelog NOTES_LANG=...）传入的，CLI 变量优先级更高
  NOTES_LANG:
    sh: printf '%s' "${NOTES_LANG:-}"
  LDFLAGS: '-s -w -X github.com/jy-eggroll/flk/cmd.Version={{.VERSION}} -X github.com/jy-eggroll/flk/cmd.BuildTime={{.BUILDTIME}}'
  # l10n 工具的四个位置参数：消息函数所在包、扫描目录、内嵌翻译表所在的 HTML 源、语言文件目录
  # --pkg 指向共享库 eggokit 的 l10n 包：本项目的 L10N 机制已抽到那里，源码仍写同一个 T(...)
  # 扫描范围只含 flk 自己的 cmd 与 internal，因此 internal/locales 里只保留 flk 自己的文案；
  # 升级与日志那两块文案随 eggokit 发布（eggokit/locales），运行时由 internal/locales 叠加进来
  # --html 覆盖 cmd/ui 下的页面：WebUI 的译文内嵌在页面里，只有把它交给提取器，
  # 页面文案的漏译与失效译文才会被 l10n:check 拦住（否则只会静默回退英文）
  # 注意分成三个文件后的布局：扫描器只收集 .html，因此 MSG 翻译表必须留在
  # config.html（不能搬去 app.js）；style.css 与 app.js 对该扫描器不可见，属预期
  # 与 internal/locales/locales.go 里的语言列表是一对，改动时要一起看
  L10N_ARGS: '--pkg github.com/jy-eggroll/eggokit/l10n --src cmd,internal --html cmd/ui --dir internal/locales'
  # E2E 现场（截图、录屏、回看页、临时 store）的落点，只在这里声明一次
  # 刻意放在 .task/ 下面，并且核实过 .task/ 确实被 .gitignore 忽略（第 2 行的 .task/），
  # 现场再大也不会污染 git status
  # 不放 build/ 的原因：clean 任务是 rm -rf build/，现场放那儿会被 clean 顺手删掉；.task/ 是
  # Task 自己的元数据目录，与构建产物无关，clean 不碰它
  E2E_ARTIFACTS: .task/e2e

tasks:
  default:
    desc: Verify and build for all platforms
    # cmds 按声明顺序执行，避免 deps 并行导致构建在验证完成前开始
    cmds:
      - task: verify
      - task: build-all

  # mod-tidy 与 mod-tidy:check 是一对：前者整理依赖，后者只校验不修改
  # 门禁刻意使用 -diff 而不是直接执行 tidy：直接执行只会就地改掉 go.mod，
  # 检查本身永远不会失败，形同虚设
  mod-tidy:
    desc: 整理 Go 模块依赖 (go mod tidy)
    cmds:
      - go mod tidy

  mod-tidy:check:
    desc: 校验 go.mod/go.sum 已整理（只读，不修改文件）
    cmds:
      - go mod tidy -diff

  # 只把磁盘上确实存在的文件交给 gofmt：git ls-files 读的是索引，会把「已删除但尚未暂存」
  # 的文件一并列出，重构中途直接交给 gofmt 会以 lstat 失败收场，报出来的却是「格式检查不过」——
  # 一个与格式毫无关系的假失败（实测出现过：抽包删掉 34 个文件后 verify 就卡在这里）
  fmt:check:
    desc: Check Go source formatting
    cmds:
      - |
        unformatted=""
        for file in $(git ls-files --cached --others --exclude-standard '*.go'); do
          if [ -f "$file" ]; then
            result="$(gofmt -l "$file")"
            if [ -n "$result" ]; then
              unformatted="$unformatted$result
        "
            fi
          fi
        done
        if [ -n "$unformatted" ]; then
          printf '以下 Go 文件未通过 gofmt 检查：\n%s' "$unformatted" >&2
          exit 1
        fi

  # fmt 是 fmt:check 的修复动作，仅用于本地，不纳入 verify
  # 与 fmt:check 使用同一份文件集（受版本控制的 Go 文件），避免两处标准不一致
  fmt:
    desc: 格式化 Go 代码 (gofmt)
    cmds:
      - |
        for file in $(git ls-files --cached --others --exclude-standard '*.go'); do
          if [ -f "$file" ]; then
            gofmt -w "$file"
          fi
        done

  # l10n:check 是语言文件的只读门禁：校验默认语言文件与源码**及页面**一致、语言文件均已按
  # 字典序排列且能被 go-i18n 正常解析、译文没有失效条目、页面内嵌翻译表没有缺口。
  # 语言由英文源串充当 id，消息来源为 Go 源码的 l10n.T(...) 与 HTML 页面内嵌的 MSG 表，
  # 详见 pkg/l10n 的包注释与 pkg/l10n/scan/html.go
  l10n:check:
    desc: 校验语言文件（与源码/页面一致、已排序、可被 go-i18n 解析、页面文案无缺口）
    cmds:
      - go run github.com/jy-eggroll/eggokit/l10n/cmd/l10n check {{.L10N_ARGS}}

  # l10n:export 是 l10n:check 的修复动作：重新生成默认语言文件、重排译文文件，并打印
  # 待翻译清单、失效译文清单（源码中已删除但译文里还留着的条目，需人工删除）、页面内嵌
  # 翻译表的缺口与尚未迁移的存量中文文案（迁移进度指标）
  l10n:export:
    desc: 重新生成语言文件（覆盖 en.json、重排译文、打印待翻译/失效译文/页面缺口与待迁移清单）
    cmds:
      - go run github.com/jy-eggroll/eggokit/l10n/cmd/l10n export {{.L10N_ARGS}}

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  test:
    desc: Run all Go tests without cached results
    cmds:
      - go test ./... -count=1

  test:race:
    desc: Run all Go tests with the race detector
    cmds:
      - go test -race ./... -count=1

  verify:
    desc: Run all verification checks
    # 验证项顺序执行，保证失败时立即停止且日志归属清晰
    # 依赖整理排在最前：go.mod/go.sum 与源码不一致时，后续检查的结论都不可信
    cmds:
      - task: mod-tidy:check
      - task: fmt:check
      - task: vet
      - task: l10n:check
      - task: test
      - task: test:race

  # verify:actions 是工作流层的按需验收：actionlint 能拦住 YAML 语法错误、未定义的
  # inputs/secrets、非法的事件与权限写法等——这些错在 CI 上要等到工作流被真正触发才暴露，
  # 本地先跑一遍能省一轮「推送 → 等红灯 → 再改」
  # 刻意不挂进 verify：actionlint 不是每个贡献者都装了的工具，把它做成硬依赖会让
  # 只改 Go 代码的人也无从通过校验；缺工具时给出安装指引而不是直接 command not found
  # 用法：task verify:actions
  verify:actions:
    desc: '校验 GitHub Actions 工作流（按需，需 actionlint，用法: task verify:actions）'
    cmds:
      - |
        set -eu
        if ! command -v actionlint >/dev/null 2>&1; then
          printf '缺少 actionlint：本任务用它校验 .github/workflows/*.yml\n  安装（brew）：brew install actionlint\n  安装（go）：go install github.com/rhysd/actionlint/cmd/actionlint@latest\n' >&2
          exit 1
        fi
        actionlint .github/workflows/*.yml

  # verify:browser 是浏览器层的按需验收，刻意不挂进 verify/default：它要构建二进制、要起真实服务、
  # 要开真实 Chromium，代价比其它检查高一个量级，只在改 WebUI 或交付前跑
  # 二进制构建到系统临时目录而不是 build/：build/ 是 build-all 的地盘，两边同时跑会互相踩
  # 现场落在 {{.E2E_ARTIFACTS}}（.gitignore 已忽略 .task/，clean 也不会碰它），所以它不会往
  # git status 里加东西
  # 用法：task verify:browser [ONLY=B1,B2] [LABEL=名字]；ONLY 用来只跑指定编号，调断言时省时间
  verify:browser:
    desc: '用真实 Chromium 验收 flk serve 的 WebUI 并生成回看页（按需，用法: task verify:browser [ONLY=B1,B2] [LABEL=名字]）'
    cmds:
      - |
        set -eu

        # 依赖前置检查：缺什么就直接讲清楚，而不是把 ERR_MODULE_NOT_FOUND 之类的堆栈丢给使用者
        # Chromium 不做在这里检查：定位顺序是 lib/browser.mjs 的知识，重复一份必然漂移，
        # 那份提示由 verify.mjs 的启动自检给出（缺浏览器时退出码 2，不是构建失败）
        if ! command -v node >/dev/null 2>&1; then
          printf '缺少 node：本任务用 Node 跑浏览器断言\n  安装（mise）：mise use -g node@24\n' >&2
          exit 1
        fi
        if ! (cd tools/e2e && node -e "import('playwright-core')" 2>/dev/null); then
          printf '缺少 playwright-core：浏览器断言依赖它（仓库是纯 Go 项目，这份依赖只装在 tools/e2e 下）\n  安装：cd tools/e2e && pnpm install\n' >&2
          exit 1
        fi

        # 临时目录用 mktemp 生成，退出时清掉；--label 与 --only 用任务变量传入，未传时为空
        work="$(mktemp -d "${TMPDIR:-/tmp}/flk-e2e.XXXXXX")"
        trap 'rm -rf "$work"' EXIT

        go build -ldflags="{{.LDFLAGS}}" -trimpath -o "$work/{{.APP}}" .

        label="{{.LABEL}}"
        if [ -z "$label" ]; then label=local; fi
        # 用位置参数拼命令行而不是拼字符串：可选参数一个一个追加，空值时不会多出一个空参数，
        # 也不需要为了「能不能加引号」纠结（--only=B1,B2 本身就是一个参数，必须整体加引号）
        set -- --binary="$work/{{.APP}}" --root="{{.E2E_ARTIFACTS}}" --label="$label"
        if [ -n "{{.ONLY}}" ]; then set -- "$@" --only="{{.ONLY}}"; fi

        node tools/e2e/verify.mjs "$@"

  # verify:api 是 HTTP 层的按需验收，补的正是浏览器 E2E 够不着的那一半：tools/e2e 验页面交互，
  # 这里验服务端行为——/api/unlink 的回收站副作用（noTrash 开关）、清单记录的移除、两个并发请求
  # 互不干扰、服务端终端不被文件系统操作的输出污染、进程存活。这些断言既进不了 Go 单测的函数边界，
  # 也进不了只认 DOM 的浏览器断言，所以单独一层
  # 与 verify:browser 同级，同样刻意不挂进 verify/default：要构建二进制、要起真实服务，
  # 代价比静态检查高一个量级，只在改 serve / unlink 或交付前跑
  # 隔离：被测二进制、store、测试数据、服务日志全在脚本自建的 mktemp 目录里，回收站用 XDG_DATA_HOME
  # 重定向到临时目录（不碰真实家目录），跑完整体删除，不会往 git status 里加东西
  # 用法：task verify:api [BINARY=/path/to/flk]；不给 BINARY 时脚本用仓库源码构建一份临时二进制，
  # 给了就用它（换二进制做前后对比时用）
  verify:api:
    desc: '验收 flk serve 的 /api/unlink 服务端行为（按需，用法: task verify:api [BINARY=/path/to/flk]）'
    cmds:
      - |
        set -eu

        # 依赖前置检查：缺什么就直接讲清楚，而不是把 command not found 之类的报错丢给使用者
        # go 只在没传 BINARY 时才需要（脚本要拿它构建被测二进制），一并检查，免得跑到一半才失败
        if [ -z "{{.BINARY}}" ] && ! command -v go >/dev/null 2>&1; then
          printf '缺少 go：本任务要用它构建被测二进制\n  安装（brew/mise）：brew install go\n  或改用 task verify:api BINARY=/path/to/flk\n' >&2
          exit 1
        fi
        for tool in curl jq; do
          if ! command -v "$tool" >/dev/null 2>&1; then
            printf '缺少 %s：断言脚本用它发请求 / 解析服务端返回的 JSON\n  安装（brew）：brew install %s\n' "$tool" "$tool" >&2
            exit 1
          fi
        done

        # 用位置参数拼命令行而不是拼字符串：未传 BINARY 时不会多出一个空参数
        set --
        if [ -n "{{.BINARY}}" ]; then set -- --binary="{{.BINARY}}"; fi

        bash tools/api-e2e/unlink.sh "$@"

  # build-all 现在由共享库 eggokit 的 buildall 驱动：平台清单、产物命名与 -ldflags 注入
  # 全部来自仓库根目录的 release.json，因此「有哪些平台有产物」只有一处真源，
  # 增删平台只改清单，不再需要人肉同步十几个 build:* 任务（那份同步漏一处就漏一个产物）
  # --package 走默认值 "."：flk 的 main 包就在仓库根目录，无需显式指定
  # --version/--build-time 仍由本仓库的 VERSION/BUILDTIME 变量注入，与原实现逐字一致
  build-all:
    desc: Build all platform binaries in parallel
    cmds:
      - go run github.com/jy-eggroll/eggokit/release/cmd/buildall --manifest release.json --version "{{.VERSION}}" --build-time "{{.BUILDTIME}}" --out-dir build --root .

  # 构建任务不声明 sources/generates，因为 VERSION 和 BUILDTIME 不参与文件时间戳判断
  # 这样每次显式调用都会真正执行 go build，避免复用嵌入旧版本信息的二进制文件
  build:
    desc: Build for current platform
    cmds:
      - mkdir -p build
      - go build -ldflags="{{.LDFLAGS}}" -trimpath -o build/{{.APP}}{{exeExt}} .

  # changelog 现在只是一层薄封装：真正的生成逻辑在共享库 eggokit 的 changelog 命令里，
  # 与 buildall 共用同一份 release.json，因此下载表格里的平台与构建产物不会再各说各话
  # 语言优先级由命令自己决定（--lang > 清单 releaseNotesLang > 内置默认 en）：
  # NOTES_LANG 为空时**刻意不传 --lang**，让清单里的 releaseNotesLang(zh-CN) 生效，
  # 这样默认发布说明仍是中文，与迁移前的输出保持一致
  # 原始 shell 版本已删除：那版在 CHANGELOG 里找不到当前版本小节时会输出一片空白
  # （首个正式版 Release 正文为空的根因），共享库版本改为输出点名文件的默认提示
  changelog:
    desc: '生成发布更新日志并输出到 stdout（用法: task changelog VERSION=x.y.z [TYPE=release|dev] [NOTES_LANG=zh-CN|en]）'
    cmds:
      - |
        set -e
        if [ -z "{{.VERSION}}" ]; then
          echo "Error: VERSION is required. Usage: task changelog VERSION=x.y.z" >&2
          exit 1
        fi

        # 用位置参数拼命令行而不是拼字符串：NOTES_LANG 为空时不会多出一个空参数 --lang，
        # 也不会为了「能不能加引号」纠结
        set -- --manifest release.json --version "{{.VERSION}}" --type "{{.TYPE}}" --root .
        if [ -n "{{.NOTES_LANG}}" ]; then set -- "$@" --lang "{{.NOTES_LANG}}"; fi

        go run github.com/jy-eggroll/eggokit/release/cmd/changelog "$@"

  clean:
    desc: Remove all build artifacts
    cmds:
      - rm -rf build/

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flk 管理面板</title>
    <!-- 使用 Tailwind CSS CDN 实现美观 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 使用 Vue 3 CDN 实现极简响应式交互 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div id="app" class="max-w-5xl mx-auto p-6">
        <header class="flex justify-between items-center mb-8 border-b pb-4">
            <h1 class="text-3xl font-bold text-blue-600">flk 控制台</h1>
            <div class="flex gap-2">
                <button @click="checkLinks" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded shadow">检查链接</button>
                <button @click="fixLinks" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded shadow">修复链接</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- 左侧：工具与表单 -->
            <div class="md:col-span-1 space-y-6">
                <!-- 视图切换 -->
                <div class="bg-white p-4 rounded-lg shadow-sm border">
                    <h2 class="text-lg font-semibold mb-4">视图模式</h2>
                    <div class="flex gap-2">
                        <button @click="viewMode = 'list'" :class="viewMode === 'list' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100'" class="px-3 py-1 rounded w-1/2">链接列表</button>
                        <button @click="viewMode = 'json'" :class="viewMode === 'json' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100'" class="px-3 py-1 rounded w-1/2">JSON 编辑</button>
                    </div>
                </div>

                <!-- 创建链接表单 -->
                <div class="bg-white p-4 rounded-lg shadow-sm border" v-if="viewMode === 'list'">
                    <h2 class="text-lg font-semibold mb-4">新建链接</h2>
                    <form @submit.prevent="createLink" class="space-y-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">类型</label>
                            <select v-model="form.type" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                                <option value="symlink">符号链接 (symlink)</option>
                                <option value="hardlink">硬链接 (hardlink)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">真实路径 (real/prim)</label>
                            <input v-model="form.real" type="text" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">虚拟路径 (fake/seco)</label>
                            <input v-model="form.fake" type="text" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">设备标识</label>
                            <input v-model="form.device" type="text" placeholder="留空使用当前设备" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                        </div>
                        <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded shadow">创建</button>
                    </form>
                </div>
            </div>

            <!-- 右侧：主要内容区 -->
            <div class="md:col-span-2">
                <!-- JSON 编辑器 -->
                <div v-if="viewMode === 'json'" class="bg-white p-4 rounded-lg shadow-sm border h-full">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold">Store JSON 直接编辑</h2>
                        <button @click="saveJson" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-sm shadow">保存更改</button>
                    </div>
                    <textarea v-model="rawJson" class="w-full h-[600px] font-mono text-sm p-4 border rounded bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <!-- 链接列表 -->
                <div v-if="viewMode === 'list'" class="bg-white rounded-lg shadow-sm border overflow-hidden">
                    <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                        <h2 class="text-lg font-semibold">当前配置概览</h2>
                        <button @click="loadData" class="text-sm text-gray-500 hover:text-blue-500">刷新数据</button>
                    </div>
                    <div class="p-4 text-gray-500 text-center py-12" v-if="!hasData">
                        暂无链接数据，请在左侧创建或直接编辑 JSON。
                    </div>
                    <pre v-else class="p-4 text-xs overflow-auto max-h-[600px] bg-gray-50">{{ storeData }}</pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed } = Vue;

        createApp({
            setup() {
                const viewMode = ref('list'); // list 或 json
                const storeData = ref({});
                const rawJson = ref('');
                
                const form = ref({
                    type: 'symlink',
                    real: '',
                    fake: '',
                    device: ''
                });

                const loadData = async () => {
                    try {
                        const res = await fetch('/api/store');
                        const data = await res.json();
                        storeData.value = data;
                        rawJson.value = JSON.stringify(data, null, 4);
                    } catch (e) {
                        alert('加载数据失败: ' + e.message);
                    }
                };

                const saveJson = async () => {
                    try {
                        // Validate JSON
                        JSON.parse(rawJson.value);
                        
                        const res = await fetch('/api/store', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: rawJson.value
                        });
                        if (res.ok) {
                            alert('保存成功');
                            loadData();
                        } else {
                            alert('保存失败: ' + await res.text());
                        }
                    } catch (e) {
                        alert('JSON 格式无效: ' + e.message);
                    }
                };

                const createLink = async () => {
                    try {
                        const res = await fetch('/api/cmd/create', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(form.value)
                        });
                        const result = await res.text();
                        alert(result);
                        loadData();
                    } catch (e) {
                        alert('创建失败: ' + e.message);
                    }
                };

                const checkLinks = async () => {
                    try {
                        const res = await fetch('/api/cmd/check', { method: 'POST' });
                        alert(await res.text());
                    } catch (e) {
                        alert('检查失败: ' + e.message);
                    }
                };

                const fixLinks = async () => {
                    if(!confirm('确定要执行修复操作吗？')) return;
                    try {
                        const res = await fetch('/api/cmd/fix', { method: 'POST' });
                        alert(await res.text());
                        loadData();
                    } catch (e) {
                        alert('修复失败: ' + e.message);
                    }
                };

                const hasData = computed(() => Object.keys(storeData.value || {}).length > 0);

                onMounted(() => {
                    loadData();
                });

                return {
                    viewMode, storeData, rawJson, form, hasData,
                    loadData, saveJson, createLink, checkLinks, fixLinks
                }
            }
        }).mount('#app');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flk 配置</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
  .header { background: #d97706; color: #fff; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.online { background: #22c55e; }
  .dot.offline { background: #ef4444; }
  .container { max-width: 960px; margin: 0 auto; padding: 24px; }
  .meta { font-size: 12px; color: #888; margin-bottom: 12px; display: flex; gap: 16px; }
  pre { background: #1e1e2e; color: #cdd6f4; padding: 20px; border-radius: 8px; overflow-x: auto; font-size: 13px; line-height: 1.6; font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "SF Mono", Consolas, monospace; tab-size: 2; }
  .key { color: #89b4fa; }
  .string { color: #a6e3a1; }
  .number { color: #fab387; }
  .boolean { color: #cba6f7; }
  .null { color: #f38ba8; }
  .bracket { color: #9399b2; }
  .loading { text-align: center; padding: 60px 0; color: #888; }
  .error-msg { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
  .path-info { font-size: 12px; color: #aaa; }
</style>
</head>
<body>
<div class="header">
  <h1>flk 配置</h1>
  <div class="status">
    <span class="dot offline" id="statusDot"></span>
    <span id="statusText">连接中…</span>
  </div>
</div>
<div class="container">
  <div class="meta">
    <span id="fileInfo"></span>
    <span id="updateInfo"></span>
  </div>
  <div id="error" class="error-msg" style="display:none"></div>
  <pre id="output"><div class="loading">加载中…</div></pre>
  <div class="path-info" id="storePath"></div>
</div>

<script>
const STORE_API = '/api/config';
const EVENT_API = '/api/events';

const output = document.getElementById('output');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const errorDiv = document.getElementById('error');
const fileInfo = document.getElementById('fileInfo');
const updateInfo = document.getElementById('updateInfo');
const storePathEl = document.getElementById('storePath');

function setOnline(online) {
  statusDot.className = 'dot ' + (online ? 'online' : 'offline');
  statusText.textContent = online ? '已连接' : '已断开';
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* 客户端 JSON 语法高亮 */
function highlight(json) {
  const str = JSON.stringify(json, null, 2);
  return escapeHtml(str).replace(
    /("(?:\\.|[^"\\])*")\s*:/g,
    '<span class="key">$1</span>:'
  ).replace(
    /:\s*("(?:\\.|[^"\\])*")/g,
    ': <span class="string">$1</span>'
  ).replace(
    /:\s*(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
    ': <span class="number">$1</span>'
  ).replace(
    /:\s*(true|false)/g,
    ': <span class="boolean">$1</span>'
  ).replace(
    /:\s*(null)/g,
    ': <span class="null">$1</span>'
  ).replace(
    /([\{\}\[\]])/g,
    '<span class="bracket">$1</span>'
  );
}

async function loadConfig() {
  try {
    const resp = await fetch(STORE_API);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    output.innerHTML = highlight(data);

    const meta = await fetch('/api/meta').then(r => r.json()).catch(() => ({}));
    if (meta.storePath) storePathEl.textContent = '路径: ' + meta.storePath;
    if (meta.modTime) fileInfo.textContent = '修改时间: ' + meta.modTime;
    if (meta.fileSize) fileInfo.textContent += ' | 大小: ' + meta.fileSize;

    errorDiv.style.display = 'none';
    setOnline(true);
  } catch (err) {
    errorDiv.textContent = '加载配置失败: ' + err.message;
    errorDiv.style.display = 'block';
    setOnline(false);
  }
}

let lastUpdate = Date.now();

function connectSSE() {
  const es = new EventSource(EVENT_API);
  es.onopen = () => { setOnline(true); };
  es.onerror = () => { setOnline(false); };
  es.addEventListener('updated', () => {
    lastUpdate = Date.now();
    updateInfo.textContent = '最后更新: ' + new Date().toLocaleTimeString();
    loadConfig();
  });
}

storePathEl.textContent = '连接服务端…';
loadConfig();
connectSSE();
</script>
</body>
</html>
